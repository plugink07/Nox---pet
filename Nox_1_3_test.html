const replies = ['Нокс тебя заметил.', 'Ночной страж на посту.', 'Нокс расправляет крылья.', 'Он рад, что ты рядом.', 'Тишина. Нокс наблюдает.'];
let replyIndex = 0;
let active = false;
let idleTimer;
const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
const show = i => { pet.src = frames[i]; };
async function blink() {
 if(active || document.hidden) return;
 active = true;
 for (const i of [1,2,3,4,5,0]) { show(i); await sleep(115); }
 active = false;
}
async function spread() {
 if(active) return;
 active = true;
 clearTimeout(idleTimer);
 message.textContent = replies[replyIndex++ % replies.length];
 pet.classList.add('nox-awake');
 for(const i of [6,7,8,8,7,6,0]) { show(i); await sleep(i===8 ? 300 : 160); }
 pet.classList.remove('nox-awake');
 active = false;
 scheduleBlink();
}
function scheduleBlink() {
 clearTimeout(idleTimer);
 idleTimer = setTimeout(async () => { await blink(); scheduleBlink(); }, 5000 + Math.random()*4500);
}
pet.addEventListener('click',spread);
pet.addEventListener('keydown',event => { if(event.key==='Enter'||event.key===' '){event.preventDefault();spread();} });
document.addEventListener('visibilitychange', () => {if(!document.hidden && !active){show(0);scheduleBlink();}});
scheduleBlink();
})();
