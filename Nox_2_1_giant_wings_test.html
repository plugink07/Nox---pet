 .frame .mist{position:absolute;left:46%;top:38%;width:10%;height:5%;border-radius:50%;pointer-events:none;opacity:0;filter:blur(7px);background:radial-gradient(ellipse,#d1e4f7aa 0%,#b7d4ed55 38%,transparent 75%);transform:translateY(0) scale(.65);animation:nox-exhale 11s ease-in-out infinite}

/* Nox 2.0 experimental wing pose */

.frame .wing-stage svg{width:100%;height:100%;display:block;overflow:visible}
.wing-left,.wing-right{opacity:0;transform-box:view-box;transition:transform 1.55s cubic-bezier(.19,.8,.21,1),opacity .65s ease;filter:drop-shadow(0 4px 6px #0009)}

.wing-right{transform-origin:423px 365px;transform:rotate(-29deg) scale(.72)}

.frame .eye-light{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .5s ease;background:radial-gradient(ellipse 3.1% 1.9% at 44.1% 35.1%,#7acfff8c,transparent 85%),radial-gradient(ellipse 3.1% 1.9% at 55.6% 35.1%,#7acfff8c,transparent 85%);mix-blend-mode:screen}

/* 2.1: articulated, textured wings */
.frame .wing-stage{z-index:2}
.wing-left,.wing-right{filter:drop-shadow(0 7px 8px #000b);transition:transform 1.85s cubic-bezier(.2,.75,.18,1),opacity .5s ease}
.wing-left{transform-origin:218px 385px;transform:rotate(42deg) scale(.49,.72);opacity:0}
.wing-right{transform-origin:482px 385px;transform:rotate(-42deg) scale(.49,.72);opacity:0}
.frame.spread .wing-left{opacity:1;transform:rotate(-3deg) scale(1)}
.frame.spread .wing-right{opacity:1;transform:rotate(3deg) scale(1)}
.wing-vein{fill:none;stroke:#5b6976;stroke-width:2.6;opacity:.5}

</svg></div><div aria-hidden="true" class="eye-light"></div></div><div aria-live="polite" class="msg" id="msg">Нокс наблюдает за городом.</div><button id="touch" type="button">Позвать Нокса</button><div class="hint">Нокс дышит и моргает. Прикоснись, чтобы увидеть огромные крылья (тест 2.1).</div></main><script>(function(){
const frame=document.getElementById('frame'),msg=document.getElementById('msg'),btn=document.getElementById('touch');
let resetTimer, busy=false;
function touch(){
  if(busy)return;
  busy=true; frame.classList.add('awake','spread');
  msg.textContent='Нокс расправляет крылья…';
  btn.textContent='Нокс пробудился'; btn.disabled=true;
  clearTimeout(resetTimer);
  resetTimer=setTimeout(()=>{
    frame.classList.remove('spread','awake');
    msg.textContent='Нокс снова наблюдает за городом.';
    btn.textContent='Позвать Нокса';
    setTimeout(()=>{busy=false;btn.disabled=false},1700);
  },2700);
}
frame.addEventListener('click',touch);
frame.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();touch()}});
btn.addEventListener('click',touch);
const blink=document.querySelector('.blink');
function scheduleBlink(){setTimeout(()=>{blink.classList.add('closed');setTimeout(()=>{blink.classList.remove('closed');scheduleBlink()},165)},3500+Math.random()*3400)}
scheduleBlink();
})();</script></body></html>
